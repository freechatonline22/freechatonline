<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free Chat Online | Anonymous</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5}
.screen{display:none;height:100vh}
.active{display:flex;flex-direction:column}
header{background:#075e54;color:#fff;padding:12px;text-align:center}
#chat{flex:1;overflow-y:auto;padding:10px}
.msg{max-width:80%;margin:6px;padding:8px;border-radius:8px;font-size:14px;position:relative}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff}
.tick{font-size:11px;color:#555;position:absolute;bottom:2px;right:6px}
#input{display:flex;padding:8px;background:#fff;border-top:1px solid #ccc}
#input input{flex:1;padding:8px;border-radius:20px;border:1px solid #ccc}
#input button{margin-left:5px;border:none;background:#075e54;color:#fff;padding:8px 14px;border-radius:20px}
.center{justify-content:center;align-items:center;text-align:center}
button{cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login" class="screen active center">
  <h2>Free Chat Online</h2>
  <p>Talk to strangers anonymously</p>
  <button onclick="startChat()">Start Anonymous Chat</button>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="screen">
<header>Anonymous Chat</header>
<div id="chat"></div>
<div id="input">
<input id="text" placeholder="Type a message...">
<button onclick="send()">Send</button>
</div>
</div>

<script>
const login=document.getElementById("login");
const chatScreen=document.getElementById("chatScreen");
const chat=document.getElementById("chat");
const input=document.getElementById("text");

let aiNames=["Riya","Neha","Pooja","Anu"];
let ai=aiNames[Math.floor(Math.random()*aiNames.length)];

function startChat(){
 login.classList.remove("active");
 chatScreen.classList.add("active");
 systemMsg("You are now connected");
 setTimeout(aiReply,1500);
}

function systemMsg(text){
 let div=document.createElement("div");
 div.className="msg other";
 div.innerHTML="<b>System</b><br>"+text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function send(){
 if(!input.value.trim())return;
 let text=input.value;
 input.value="";

 let div=document.createElement("div");
 div.className="msg me";
 div.innerHTML="<b>You</b><br>"+text+"<span class='tick'>✔</span>";
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;

 // seen simulation
 setTimeout(()=>{
   div.querySelector(".tick").innerText="✔✔";
 },1500);

 setTimeout(aiReply,2000);
}

  "bas casual hi baat kar rahi hoon 😄"
 ];
 let r=replies[Math.floor(Math.random()*replies.length)];

 let div
