<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Chat Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#000;
}

/* -------- LANDING -------- */
#landing{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=800&q=80")
  center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay{
  background:rgba(0,0,0,0.55);
  padding:30px;
  border-radius:12px;
  text-align:center;
  color:#fff;
}

.overlay h1{margin-bottom:10px}
.overlay p{font-size:14px;opacity:0.9}

.overlay button{
  margin-top:15px;
  padding:12px 25px;
  font-size:16px;
  background:#25d366;
  border:none;
  border-radius:25px;
  color:#fff;
  cursor:pointer;
}

/* -------- CHAT -------- */
#chatPage{display:none;background:#f0f2f5;height:100vh}

header{
  background:#075e54;
  color:#fff;
  padding:10px;
  text-align:center;
}

#chat{
  height:80vh;
  overflow-y:auto;
  padding:10px;
}

.msg{
  max-width:80%;
  margin:6px;
  padding:8px;
  border-radius:8px;
  font-size:14px;
}

.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff}

#input{
  display:flex;
  padding:8px;
  background:#fff;
}

#input input{
  flex:1;
  padding:8px;
  border-radius:20px;
  border:1px solid #ccc;
}

#input button{
  margin-left:5px;
  background:#075e54;
  color:#fff;
  border:none;
  border-radius:20px;
  padding:8px 14px;
}
</style>
</head>

<body>

<!-- LANDING SCREEN -->
<div id="landing">
  <div class="overlay">
    <h1>Anonymous Chat</h1>
    <p>Talk freely with strangers<br>No login • No name</p>
    <button onclick="startChat()">Start Anonymous Chat</button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatPage">
  <header>Anonymous Chat</header>
  <div id="chat"></div>
  <div id="input">
    <input id="text" placeholder="Type message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- FIREBASE (COMPAT) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 🔴 APNA REAL FIREBASE CONFIG YAHA PASTE KARO
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PROJECT.firebaseapp.com",
  databaseURL: "https://PROJECT-default-rtdb.firebaseio.com",
  projectId: "PROJECT",
  storageBucket: "PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const chatRef = db.ref("globalChat");

const chat = document.getElementById("chat");
const input = document.getElementById("text");

const userId = "Anon-" + Math.floor(Math.random()*10000);

function startChat(){
  document.getElementById("landing").style.display="none";
  document.getElementById("chatPage").style.display="block";
}

function send(){
  if(!input.value.trim()) return;

  chatRef.push({
    user:userId,
    text:input.value,
    time:Date.now()
  });

  input.value="";
}

chatRef.limitToLast(50).on("child_added",snap=>{
  const m=snap.val();
  const div=document.createElement("div");
  div.className="msg "+(m.user===userId?"me":"other");
  div.innerHTML=`<b>${m.user}</b><br>${m.text}`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});
</script>

</body>
</html>
