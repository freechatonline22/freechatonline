<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Chat Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5}
header{background:#075e54;color:#fff;padding:10px;text-align:center}
#chat{height:80vh;overflow-y:auto;padding:10px}
.msg{max-width:80%;margin:6px;padding:8px;border-radius:8px;font-size:14px}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff}
.tick{font-size:11px;color:#555}
#input{display:flex;padding:8px;background:#fff}
#input input{flex:1;padding:8px;border-radius:20px;border:1px solid #ccc}
#input button{margin-left:5px;background:#075e54;color:#fff;border:none;border-radius:20px;padding:8px 14px}
</style>
</head>
<body>

<header>Anonymous Chat</header>
<div id="chat"></div>

<div id="input">
<input id="text" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
// 🔴 REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chatRef = db.ref("globalChat");

const chat = document.getElementById("chat");
const input = document.getElementById("text");

const userId = "Anon-" + Math.floor(Math.random()*10000);

function send(){
 if(!input.value.trim()) return;

 const msgRef = chatRef.push();
 msgRef.set({
   user:userId,
   text:input.value,
   seen:false,
   time:Date.now()
 });
 input.value="";
}

chatRef.limitToLast(50).on("child_added",snap=>{
 const m=snap.val();
 const div=document.createElement("div");
 div.className="msg "+(m.user===userId?"me":"other");
 div.innerHTML=`<b>${m.user}</b><br>${m.text}
 <div class="tick">${m.user===userId ? "✔✔" : ""}</div>`;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
