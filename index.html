<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Chat Online - Y99 Style</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5 url('https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg') no-repeat center center/cover;}
header{background:rgba(7,94,84,0.9);color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:18px;}
#chat-container{height:60vh;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:75%;padding:8px;border-radius:10px;font-size:14px;word-wrap:break-word;}
.me{background:#dcf8c6;margin-left:auto;}
.other{background:#fff;margin-right:auto;}
.tick{font-size:11px;color:#555;margin-top:2px;text-align:right;}
#input-area{display:flex;gap:6px;padding:10px;background:rgba(255,255,255,0.9);}
#input-area input{flex:1;padding:8px;border-radius:20px;border:1px solid #ccc;outline:none;}
#input-area button{padding:8px 12px;background:#075e54;color:#fff;border:none;border-radius:20px;cursor:pointer;}
#file-input{display:none;}
#room-select{margin:10px;padding:6px;border-radius:10px;border:1px solid #ccc;outline:none;}
</style>
</head>
<body>

<header>Free Chat Online - Y99 Style</header>

<select id="room-select">
  <option value="enormous">Enormous Chat</option>
  <option value="18plus">18+ Chat</option>
  <option value="30plus">30+ Chat</option>
  <option value="boys">Friend Boys</option>
  <option value="girls">Friend Girls</option>
  <option value="students">Student Chat</option>
</select>

<div id="chat-container"></div>

<div id="input-area">
<input id="text" placeholder="Type a message...">
<input type="file" id="file-input" accept="image/*,audio/*">
<button onclick="send()">Send</button>
<button onclick="document.getElementById('file-input').click()">📎</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// 🔴 Replace with your Firebase config
var firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// Anonymous user ID
var userId = localStorage.getItem('anonUserId') || 'Anon-' + Math.floor(Math.random()*10000);
localStorage.setItem('anonUserId', userId);

const chatContainer = document.getElementById('chat-container');
const inputField = document.getElementById('text');
const fileInput = document.getElementById('file-input');
const roomSelect = document.getElementById('room-select');

var currentRoom = roomSelect.value;
var chatRef = db.ref("rooms/"+currentRoom);

// Change room
roomSelect.addEventListener('change', ()=>{
  currentRoom = roomSelect.value;
  chatContainer.innerHTML="";
  chatRef = db.ref("rooms/"+currentRoom);
  listenMessages();
});

// Send message
function send(){
  const text = inputField.value.trim();
  const file = fileInput.files[0];
  if(!text && !file) return;

  const msgData = {user:userId, time:Date.now(), seen:false};

  if(text) msgData.text = text;

  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      if(file.type.startsWith('image')){
        msgData.img = e.target.result;
      } else if(file.type.startsWith('audio')){
        msgData.audio = e.target.result;
      }
      pushMessage(msgData);
    };
    reader.readAsDataURL(file);
  } else {
    pushMessage(msgData);
  }

  inputField.value="";
  fileInput.value="";
}

// Push message to Firebase
function pushMessage(data){
  chatRef.push(data);
  // Auto-reply AI placeholder for demonstration
  if(Math.random()<0.4){ // 40% chance AI replies
    setTimeout(()=>{ 
      const aiMsg = {
        user:"AI-Bot",
        text:"Hi! This is AI auto-reply 😊",
        time:Date.now(),
        seen:false
      };
      chatRef.push(aiMsg);
    }, Math.random()*2000+1000); // random delay 1-3s
  }
}

// Listen messages
function listenMessages(){
  chatRef.limitToLast(100).off();
  chatRef.limitToLast(100).on("child_added",function(snap){
    const m = snap.val();
    const div = document.createElement('div');
    div.className = "msg " + (m.user===userId?"me":(m.user.startsWith("AI")?"other":"other"));
    let html = `<b>${m.user}</b><br>`;
    if(m.text) html += m.text + "<br>";
    if(m.img) html += `<img src="${m.img}" style="max-width:70%;border-radius:10px;"><br>`;
    if(m.audio) html += `<audio controls src="${m.audio}"></audio><br>`;
    html += `<div class="tick">${m.user===userId ? (m.seen?"✔✔":"✔") : ""}</div>`;
    div.innerHTML = html;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });
}

listenMessages();
</script>
</body>
</html>
