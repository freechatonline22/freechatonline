<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonChat | Real-time</title>
<style>
  body { font-family: sans-serif; background: #f0f2f5; margin:0; display:flex; flex-direction:column; height:100vh; }
  header { background:#075e54; color:white; padding:15px; text-align:center; font-weight:bold; }
  #chat-container { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .message { max-width:80%; padding:10px; border-radius:10px; font-size:14px; word-wrap:break-word; }
  .received { align-self:flex-start; background:white; }
  .sent { align-self:flex-end; background:#dcf8c6; }
  .user-id { font-size:10px; color:#888; display:block; }
  #input-area { background:white; padding:10px; display:flex; gap:5px; border-top:1px solid #ddd; }
  input { flex:1; padding:10px; border:1px solid #ccc; border-radius:20px; outline:none; }
  button { background:#075e54; color:white; border:none; padding:10px 15px; border-radius:20px; cursor:pointer; }
  #login-button { margin:10px; background:#34b7f1; }
</style>
</head>
<body>

<header>AnonChat - Anonymous + Google Login</header>

<div id="chat-container"></div>

<form id="input-area">
  <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<button id="login-button">Login with Google</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

// 🔹 Your Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCHKrZQV0RPSvGCJ5tKeWiloSdQlUgtSf8",
    authDomain: "freechatonline-36529.firebaseapp.com",
    databaseURL: "https://freechatonline-36529-default-rtdb.firebaseio.com",
    projectId: "freechatonline-36529",
    storageBucket: "freechatonline-36529.firebasestorage.app",
    messagingSenderId: "570224046985",
    appId: "1:570224046985:web:6555207c4e303ee049e758",
    measurementId: "G-RQH157LX7C"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const messagesRef = ref(db, 'messages');

let userId = localStorage.getItem('anonUserId') || 'User-' + Math.floor(Math.random()*10000);
localStorage.setItem('anonUserId', userId);

const chatContainer = document.getElementById('chat-container');
const messageForm = document.getElementById('input-area');
const messageInput = document.getElementById('messageInput');
const loginButton = document.getElementById('login-button');

// 🔹 Handle Google Login
loginButton.addEventListener('click', () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider)
    .then((result) => {
        userId = result.user.displayName || result.user.email;
        localStorage.setItem('anonUserId', userId);
        alert('Logged in as '+userId);
    }).catch((error) => {
        console.error(error);
        alert('Login failed');
    });
});

// 🔹 Listen auth state
onAuthStateChanged(auth, user => {
    if(user){
        userId = user.displayName || user.email;
        localStorage.setItem('anonUserId', userId);
    }
});

// 🔹 Send Message
messageForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const text = messageInput.value.trim();
    if(text){
        push(messagesRef, { userId, text, timestamp: serverTimestamp() });
        messageInput.value = "";
    }
});

// 🔹 Receive Messages
onChildAdded(messagesRef, (data)=>{
    const msg = data.val();
    const div = document.createElement('div');
    const isMe = msg.userId === userId;
    div.className = `message ${isMe?'sent':'received'}`;
    div.innerHTML = `<span class="user-id">${isMe?'You':msg.userId}</span>${msg.text}`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
});
</script>

</body>
</html>
