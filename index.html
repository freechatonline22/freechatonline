<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Chat Online</title>

<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5}

/* ---------- ENTRY PAGE ---------- */
#entry{
  height:100vh;
  background:url("https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg") center/cover no-repeat;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  text-align:center;
}
#entry h1{font-size:32px;margin-bottom:10px}
#entry p{opacity:.9}
#entry button{
  margin-top:20px;
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:25px;
  background:#25d366;
  color:#fff;
  cursor:pointer;
}

/* ---------- CHAT PAGE ---------- */
#chatPage{display:none;height:100vh;flex-direction:column}

header{
  background:#075e54;
  color:#fff;
  padding:12px;
  text-align:center;
  font-weight:bold;
}

#groups{
  padding:6px;
  border:none;
  outline:none;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
  background:#ece5dd;
}

.msg{
  max-width:75%;
  padding:8px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff}

#inputBox{
  display:flex;
  padding:8px;
  background:#fff;
}
#inputBox input{
  flex:1;
  padding:8px;
  border-radius:20px;
  border:1px solid #ccc;
}
#inputBox button{
  margin-left:5px;
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#075e54;
  color:#fff;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry">
  <h1>Free Chat Online</h1>
  <p>Talk with strangers anonymously</p>
  <button onclick="startChat()">Start Anonymous Chat</button>
</div>

<!-- CHAT -->
<div id="chatPage">
  <header>
    Anonymous Chat
    <br>
    <select id="groups">
      <option value="online">🟢 Online Now</option>
      <option value="enormous">Enormous Chat</option>
      <option value="18plus">18+ Chat</option>
      <option value="30plus">30+ Chat</option>
      <option value="boys">Boys Chat</option>
      <option value="girls">Girls Chat</option>
      <option value="students">Student Chat</option>
    </select>
  </header>

  <div id="chat"></div>

  <div id="inputBox">
    <input id="msg" placeholder="Type a message…">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// 🔴 REPLACE FIREBASE DETAILS
var firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// USER
var user = localStorage.getItem("anonUser") || "Anon-"+Math.floor(Math.random()*10000);
localStorage.setItem("anonUser", user);

// ONLINE STATUS
var onlineRef = db.ref("online/"+user);
onlineRef.set(true);
window.onbeforeunload = ()=>onlineRef.remove();

// UI
var entry=document.getElementById("entry");
var chatPage=document.getElementById("chatPage");
var chat=document.getElementById("chat");
var msg=document.getElementById("msg");
var groupSelect=document.getElementById("groups");

var room="online";
var ref=db.ref("rooms/"+room);

function startChat(){
  entry.style.display="none";
  chatPage.style.display="flex";
  listen();
}

groupSelect.onchange=function(){
  room=this.value;
  chat.innerHTML="";
  ref=db.ref("rooms/"+room);
  listen();
};

function send(){
  if(!msg.value.trim())return;
  ref.push({user:user,text:msg.value,time:Date.now()});
  msg.value="";
}

function listen(){
  ref.off();
  ref.limitToLast(100).on("child_added",snap=>{
    var m=snap.val();
    var d=document.createElement("div");
    d.className="msg "+(m.user===user?"me":"other");
    d.innerHTML="<b>"+m.user+"</b><br>"+m.text;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
  });
}
</script>

</body>
</html>
